---
services:
  ocrmypdf-batch:
    image: meyay/ocrmypdf-batch:latest@sha256:e778d0b8a1d9416f5b88e8a7381506e8b45ccf0aa6b21c83b5d0d28275be3e6c
    container_name: ocrmypdf-batch
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      OCRMYPDF_OPTIONS: "-l deu+eng"
    # user: "1000:1000"  # run as a different UID/GID; chown ./in ./out ./processed to match
    volumes:
      - ./in:/in
      - ./out:/out
      - ./processed:/processed
