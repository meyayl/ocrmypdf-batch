---
services:
  ocrmypdf-batch:
    image: meyay/ocrmypdf-batch:latest@sha256:2cf80e640d2712e486b5a217e45954790cd0fe1d4c13c83bf5f27edc0e920994
    container_name: ocrmypdf-batch
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      OCRMYPDF_OPTIONS: "-l deu+eng"
    # user: "1000:1000"  # run as a different UID/GID; chown ./in ./out ./processed to match
    volumes:
      - ./in:/in
      - ./out:/out
      - ./processed:/processed
