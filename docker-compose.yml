---
services:
  ocrmypdf-batch:
    image: meyay/ocrmypdf-batch:latest@sha256:02be09788800aa69feacaabf7640ab618097cc3dc3828731d2292dec8937200d
    container_name: ocrmypdf-batch
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      OCRMYPDF_OPTIONS: "-l deu+eng"
    # user: "1000:1000"  # run as a different UID/GID; chown ./in ./out ./processed to match
    volumes:
      - ./in:/in
      - ./out:/out
      - ./processed:/processed
