---
# Same as privileged-rw.yml, plus a read-only root filesystem to prove the
# image works under that hardening constraint (ocrmypdf/tesseract still get
# scratch space via the /tmp tmpfs).
services:
  ocrmypdf-batch:
    image: ${IMAGE:?IMAGE required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:exec
    cap_drop:
      - ALL
    cap_add:
      - CAP_CHOWN
      - CAP_DAC_OVERRIDE
      - CAP_SETUID
      - CAP_SETGID
    security_opt:
      - no-new-privileges
    environment:
      MAP_UID: 1001
      MAP_GID: 1001
    volumes:
      - ./in:/in
      - ./out:/out
      - ./processed:/processed
