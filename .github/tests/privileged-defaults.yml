---
# Root container, zero environment overrides: the documented zero-config
# quick-start path. su-exec self-targets 0:0, but still needs
# CAP_SETUID/CAP_SETGID since it unconditionally calls setgroups()/setuid()/
# setgid() regardless of whether the target differs from the current id.
services:
  ocrmypdf-batch:
    image: ${IMAGE:?IMAGE required}
    restart: unless-stopped
    tmpfs:
      - /tmp:exec
    cap_drop:
      - ALL
    cap_add:
      - CAP_SETUID
      - CAP_SETGID
    security_opt:
      - no-new-privileges
    volumes:
      - ./in:/in
      - ./out:/out
      - ./processed:/processed
